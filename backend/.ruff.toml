target-version = "py312"
line-length = 100

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "TCH"]
ignore = [
    "B008",  # FastAPI Depends in defaults is idiomatic
    "E501",  # line length handled by formatter
    "SIM108",  # don't force if-else-assign
]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"
